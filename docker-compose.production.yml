# Rotate container logs so they cannot fill the server disk (5 x 10 MB per service).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mysql-db:
    image: mysql:8.0
    logging: *default-logging
    restart: unless-stopped
    # Sized for an 8 GB office AIO: ~330 MB idle instead of ~570 MB with defaults.
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=256M
      - --innodb-log-buffer-size=8M
      - --max-connections=60
      - --table-open-cache=400
      - --tmp-table-size=16M
      - --max-heap-table-size=16M
    mem_limit: 768m
    environment:
      # Office time (WITA, UTC+8): "today" and timestamps must match Sulawesi Utara.
      TZ: ${TZ:-Asia/Makassar}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: kpu_db
      MYSQL_USER: kpu_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    logging: *default-logging
    restart: unless-stopped
    # Measured: API ~100 MB; the AI model needs ~1.7 GB working memory (runs at full speed under this cap).
    mem_limit: 2560m
    command:
      - sh
      - -c
      - |
        set -e
        python -c "
        import asyncio
        from sqlalchemy import inspect
        from app.core.database import engine
        async def check():
            async with engine.begin() as conn:
                tables = await conn.run_sync(lambda c: inspect(c).get_table_names())
            await engine.dispose()
            return 'pegawai' in tables
        raise SystemExit(0 if asyncio.run(check()) else 1)
        " || python bootstrap.py
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      TZ: ${TZ:-Asia/Makassar}
      DATABASE_URL: mysql+aiomysql://kpu_app:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}@mysql-db:3306/kpu_db
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      AUTHORITY_GRANTS: ${AUTHORITY_GRANTS:-[]}
      # Keep "false" until the office validates number format and signing authority.
      OFFICIAL_ISSUANCE_ENABLED: ${OFFICIAL_ISSUANCE_ENABLED:-false}
      ENABLE_API_DOCS: "false"
      KIRANA_MODEL_DIR: /models
      # Free the AI model's ~3.5 GB after this many idle minutes (0 = never).
      KIRANA_IDLE_UNLOAD_MINUTES: ${KIRANA_IDLE_UNLOAD_MINUTES:-15}
      # 0 = automatic (physical cores). Lower it to leave CPU for other users.
      KIRANA_N_THREADS: ${KIRANA_N_THREADS:-0}
      BOOTSTRAP_ADMIN_NIP: ${BOOTSTRAP_ADMIN_NIP:?Set BOOTSTRAP_ADMIN_NIP}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:?Set BOOTSTRAP_ADMIN_NAME}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD}
    depends_on:
      mysql-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - uploads:/app/uploads
      - backups:/app/backups
      - kirana_models:/models

  frontend:
    build: ./frontend
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  kirana_models:
  uploads:
  backups:
