limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
server {
    listen 80;
    server_tokens off;
    # Rate limits are per client IP. Behind the HTTPS reverse proxy on the host
    # (Caddy etc.) every request arrives from the Docker gateway, so take the client
    # address the proxy appended to X-Forwarded-For. Safe because the production
    # compose file publishes this port on 127.0.0.1 only: just local processes can
    # connect, and only the LAST X-Forwarded-For entry (added by the proxy) is used.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;
    root /usr/share/nginx/html;
    client_max_body_size 26m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    location ~ ^/api/(v1/)?auth/login/?$ {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /health/ready { proxy_pass http://backend:8000; proxy_read_timeout 5s; }
    location /api/ {
        proxy_buffering off;
        limit_req zone=api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 660s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
