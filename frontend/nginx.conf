limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
# General API traffic per client: generous enough for bulk import and dashboards,
# still a brake on scripted abuse. Login has its own strict limit below.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
server {
    listen 80;
    server_tokens off;
    # Rate limits are per client IP. Behind the HTTPS reverse proxy on the host
    # (Caddy etc.) every request arrives from the Docker gateway, so take the client
    # address the proxy appended to X-Forwarded-For. Safe because the production
    # compose file publishes this port on 127.0.0.1 only: just local processes can
    # connect, and only the LAST X-Forwarded-For entry (added by the proxy) is used.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;
    root /usr/share/nginx/html;
    client_max_body_size 26m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    # Compress text responses (app bundle shrinks ~4x). text/event-stream is not listed,
    # so the chatbot's streamed answers are never buffered for compression.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    location ~ ^/api/(v1/)?auth/login/?$ {
        limit_req zone=login burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    # Rate-limit refusals as JSON so the app shows a readable message.
    error_page 429 = @too_many_requests;
    location @too_many_requests {
        default_type application/json;
        return 429 '{"detail":"Terlalu banyak permintaan dalam waktu singkat. Tunggu sebentar lalu coba lagi."}';
    }
    location = /health/ready { proxy_pass http://backend:8000; proxy_read_timeout 5s; }
    location /api/ {
        proxy_buffering off;
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 660s;
    }
    # Build output in /assets has content hashes in its file names: cache it for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        try_files $uri =404;
    }
    # index.html must always be revalidated so a new deployment is picked up at once.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
    location / { try_files $uri $uri/ /index.html; }
}
